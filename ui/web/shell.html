		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
}
#canvas:focus {
	outline: none;
}
#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}
#status, #status-splash {
	top: 0;
	bottom: 0;
}
#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}
#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}
#status-splash.show-image--false {
	display: none;
}
#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}
#status-splash.use-filter--false {
	image-rendering: pixelated;
}
#status-progress, #status-notice {
	display: none;
}
#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}
#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: "Noto Sans SC", sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#bfeaf7; font-family:"Noto Sans SC","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
#canvas { position:fixed; left:env(safe-area-inset-left); top:env(safe-area-inset-top); width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right)) !important; height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important; display:block; outline:none; touch-action:none; }
#status { background:#bfeaf7; color:#593c49; font:64px/1.6 "Noto Sans SC";font-synthesis:none; }
#status-splash { max-width:192px; object-fit:contain; }
html,body{overscroll-behavior:none;overflow:hidden;width:100%;height:100%;margin:0}
#safe-area-probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.mobile-device #canvas,.portrait-layout #canvas{left:var(--mushies-viewport-left,0px)!important;top:var(--mushies-viewport-top,0px)!important;width:var(--mushies-viewport-width,100vw)!important;height:var(--mushies-viewport-height,100dvh)!important}
.mobile-device #status,.portrait-layout #status{font-size:22px}
#portrait-guard{position:fixed;inset:0;z-index:100;background:#bfeaf7;color:#1f3b4d;font:20px/1.5 "Noto Sans SC","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#portrait-guard[hidden]{display:none}
#portrait-guard>div{max-width:520px}
#portrait-guard h1{font-size:32px;margin:0 0 12px}
#portrait-guard p{margin:0 0 20px}
#portrait-action{font:inherit;min-height:48px;padding:10px 22px;border:1px solid #1f9fb3;border-radius:12px;background:#ff6b57;color:#1f3b4d;cursor:pointer}
#portrait-action:focus-visible{outline:3px solid #d94c3a;outline-offset:4px}
#resize-ended-banner{position:fixed;left:calc(var(--mushies-viewport-left,0px) + 12px);top:calc(var(--mushies-viewport-top,0px) + max(12px,env(safe-area-inset-top)));width:calc(var(--mushies-viewport-width,100vw) - 24px);box-sizing:border-box;z-index:110;padding:12px 16px;border:3px solid #ffc47b;border-radius:12px;background:#7f263e;color:#fff8ed;text-align:center;font:700 clamp(20px,3.5vw,36px)/1.3 "Noto Sans SC","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;pointer-events:none}
#resize-ended-banner[hidden]{display:none}
/* The shell owns the whole viewport; never inherit Godot's stock 64px status styling. */
#status{position:fixed;inset:0;background:#f5e8de}
#status-splash,#status-progress,#status-notice{display:none!important}
#mushies-loader{position:fixed;inset:0;z-index:20;isolation:isolate;box-sizing:border-box;overflow:hidden;background:linear-gradient(180deg,#5fc8f2 0%,#c9f1ff 48%,#4fd1e0 50%,#f7e2ab 64%,#f0cf8c 100%);color:#1f3b4d;font:16px/1.4 "Noto Sans SC","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;touch-action:none}
#mushies-loader[hidden]{display:none!important}
#mushies-loader-ducks{position:absolute;inset:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:hidden;pointer-events:none}
#mushies-loader .mushies-loader-duck{position:absolute;left:var(--duck-x);top:var(--duck-y);display:block;width:var(--duck-size);height:var(--duck-size);object-fit:contain;border:0;margin:0;user-select:none;pointer-events:none;filter:drop-shadow(0 5px 3px rgba(116,78,54,.14));transform:rotate(var(--duck-angle));animation:mushies-duck-drop var(--duck-duration) cubic-bezier(.33,.05,.69,1) var(--duck-delay) both}
#mushies-loader-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(22px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));box-sizing:border-box;pointer-events:none}
#mushies-loader-message{max-width:100%;margin:0;padding:.16em .35em;border-radius:.25em;background:rgba(255,248,237,.82);color:#1f3b4d;font-size:clamp(36px,9vw,112px);line-height:1.1;font-weight:900;letter-spacing:.025em;text-align:center;text-shadow:0 3px 0 rgba(255,255,255,.8);box-shadow:0 5px 25px rgba(90,60,60,.06);animation:mushies-loading-breathe 2s ease-in-out infinite}
#mushies-loader-detail{max-width:32em;margin:0;text-align:center;font-size:16px;line-height:1.5}
#mushies-loader-detail[hidden],#mushies-loader-retry[hidden]{display:none!important}
#mushies-loader-progress{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#mushies-loader-retry{min-height:48px;padding:12px 26px;border:2px solid #d94c3a;border-radius:16px;background:#ff6b57;color:#1f3b4d;font-family:inherit;font-size:18px;font-weight:700;line-height:1.2;cursor:pointer;pointer-events:auto}
#mushies-loader-retry:hover{background:#ff8a78}
#mushies-loader-retry:focus-visible{outline:3px solid #1f3b4d;outline-offset:4px}
#mushies-loader[data-state="failure"] #mushies-loader-card{background:rgba(255,248,237,.94)}
#mushies-loader[data-state="failure"] #mushies-loader-message{font-size:clamp(26px,5vw,48px);animation:none;background:none;box-shadow:none;text-shadow:none}
#mushies-loader[data-state="failure"] .mushies-loader-duck{animation-play-state:paused}

const GODOT_CONFIG = $GODOT_CONFIG;

        if (statusMode === mode || !initializing) {

		}

		});

	function displayFailureNotice(err) {

	});
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
            window.MushiesLoader?.scriptReady();
            engine.startGame({
                'onProgress': function (current, total) {
                    // Godot reports bytes when known; unknown totals remain indeterminate.
                    window.MushiesLoader?.progress(current, total);
                },
            }).then(() => {
                // A completed transfer still prepares the engine; never fake ready.
                setStatusMode('hidden');
            }, displayFailureNotice);
	}
}());
		</script>
	</body>
